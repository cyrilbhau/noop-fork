<script>
// Fetches the frames exported by design/round4's exportSvgFrames() from the local preview server.
fetch('http://localhost:8765/export/r4-frames.json')
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
  .then(json => parent.postMessage({ pluginMessage: { type: 'frames', json } }, '*'))
  .catch(e => parent.postMessage({ pluginMessage: { type: 'error', message: String(e) } }, '*'));
</script>
