name: Bug report
description: Report a problem in NOOP for iPhone
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the iPhone adaptation. Check the [project status](https://github.com/cyrilbhau/noop-fork/blob/personal/iphone-baseline/docs/PROJECT_STATUS.md) first.
        Keep health exports, backups, credentials, and unreviewed device logs out of public reports.
        For a sensitive security finding, follow [SECURITY.md](https://github.com/cyrilbhau/noop-fork/blob/personal/iphone-baseline/SECURITY.md).
  - type: input
    id: commit
    attributes:
      label: Source commit
      description: Run git rev-parse --short HEAD in the checkout used to build the app.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and iOS version
      placeholder: iPhone model, iOS version, strap model if relevant
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Redesigned iPhone interface
        - Classic interface
        - Other or unsure
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether this happens in the foreground, with the phone locked, or after reconnecting.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional redacted evidence
      description: Share only a reviewed excerpt or screenshot with sensitive details removed. A complete health export or backup is not needed.
